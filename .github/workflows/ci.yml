name: Offline validation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: offline-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Preserve the locale file encoding: Windows must exercise CP1252 reads.
  # UTF-8 stdout affects logs only; it does not hide missing file encodings.
  PYTHONUTF8: '0'
  PYTHONIOENCODING: utf-8

jobs:
  stdlib:
    name: stdlib / ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-14]
        python: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Verify legacy Windows encoding coverage
        if: runner.os == 'Windows'
        run: python -c "import locale, sys; print('UTF8 mode:', sys.flags.utf8_mode, 'file encoding:', locale.getencoding()); assert sys.flags.utf8_mode == 0; assert locale.getencoding().lower() in ('cp1252', 'windows-1252'), 'Windows locale changed; restore a CP1252 test lane'"
      - name: Compile sources without site packages
        run: python -S -m compileall -q run.py tideway scripts tests
      - name: Run complete stdlib test suite and record actual counts
        run: python -S scripts/verify_submission.py
      - name: Run task and approval-boundary scorecard
        run: python -S -m tideway.selftest
      - name: Preserve test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: stdlib-${{ matrix.os }}-py${{ matrix.python }}
          path: |
            evidence/test-summary.json
            evidence/test-run.log
          retention-days: 14
          if-no-files-found: error

  photo:
    name: Optional photo validation / Pillow
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Install only the optional image test dependency
        run: python -m pip install --disable-pip-version-check Pillow==12.3.0
      - name: Require Pillow and exercise photo tests
        run: |
          python -c "from PIL import Image; print('Pillow', Image.__version__)"
          python -m unittest discover -s tests -p test_vision.py -v

  browser-package:
    name: Browser workflows and extracted package
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Validate workflow syntax and expressions
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 -color
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Locate the runner's installed Chrome
        shell: bash
        run: |
          chrome_path="$(command -v google-chrome || command -v google-chrome-stable)"
          "$chrome_path" --version
          echo "CHROME=$chrome_path" >> "$GITHUB_ENV"
          echo "PYTHON=$(command -v python)" >> "$GITHUB_ENV"
      - name: Check JavaScript syntax
        run: node scripts/check_javascript.mjs
      - name: Test browser integration with a fixed-output local backend
        run: node scripts/capture_screens.mjs --test-local-backend --out tmp/ci-local-backend
      - name: Test the linked payment-delay workflow
        run: node scripts/capture_screens.mjs --test-payment-delay
      - name: Validate the current source before packaging
        run: python -S scripts/verify_submission.py
      - name: Build integrity-checked review package
        run: python -S scripts/build_submission_package.py
      - name: Verify allowlist, manifest, extracted tests and fresh startup
        run: python -S scripts/verify_package.py
      - name: Preserve browser and package verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: browser-package-evidence
          path: |
            evidence/test-summary.json
            evidence/test-run.log
            evidence/screens/
            tmp/ci-local-backend/
            dist/package-manifest.json
            dist/SHA256SUMS.txt
            dist/extraction-verification.json
          retention-days: 14
          if-no-files-found: warn
