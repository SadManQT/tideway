# TideLM v3: continue from the v2 adapter with two new tools (counterparty_risk, security_check) and harder phrasing.
# Run: python3 -m mlx_lm lora --config tideway/ml/tidelm_lora_v3.yaml
model: "mlx-community/Qwen3-4B-Instruct-2507-4bit"
train: true
data: "data/tidelm-v3"
adapter_path: "models/tidelm-adapter-v3"
fine_tune_type: lora
num_layers: 16
batch_size: 4
iters: 250
learning_rate: 5.0e-5
steps_per_report: 25
steps_per_eval: 125
val_batches: 25
save_every: 125
max_seq_length: 1024
grad_checkpoint: true
mask_prompt: true
seed: 11
lora_parameters:
  rank: 16
  scale: 20.0
  dropout: 0.05
resume_adapter_file: "models/tidelm-adapter/adapters.safetensors"
