<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 290" width="1200" height="290" role="img" aria-label="How Tideway works: see, predict and plan by AI; approve, execute and prove by people and signed mandates">
  <defs>
    <style>
      .t { font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; }
      .node { opacity: 0; animation: pop .7s cubic-bezier(.34,1.56,.64,1) forwards; }
      .n1 { animation-delay: .2s } .n2 { animation-delay: .45s } .n3 { animation-delay: .7s }
      .n4 { animation-delay: 1.15s } .n5 { animation-delay: 1.4s } .n6 { animation-delay: 1.65s }
      @keyframes pop { from { opacity: 0; transform: translateY(18px) scale(.9) } to { opacity: 1; transform: none } }
      .node, .ring { transform-box: fill-box; transform-origin: center; }
      .ring { opacity: 0; animation: ring 6s ease-out infinite; }
      .r1 { animation-delay: 2.0s } .r2 { animation-delay: 3.0s } .r3 { animation-delay: 4.0s }
      .r4 { animation-delay: 5.0s } .r5 { animation-delay: 6.0s } .r6 { animation-delay: 7.0s }
      @keyframes ring { 0% { opacity: .85; transform: scale(1) } 18% { opacity: 0; transform: scale(1.55) } 100% { opacity: 0 } }
      .line { stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw 1.8s ease-out .2s forwards; }
      @keyframes draw { to { stroke-dashoffset: 0 } }
      .gate { opacity: 0; animation: fade .6s ease-out 1s forwards; }
      @keyframes fade { to { opacity: 1 } }
    </style>
  </defs>
  <rect width="1200" height="290" rx="18" fill="#0b2a45"/>
  <g class="t">
    <text x="40" y="44" fill="#5cc2c6" font-size="13" font-weight="700" letter-spacing="3">HOW TIDEWAY WORKS</text>
    <rect x="40" y="56" width="60" height="3" fill="#d4a72c"/>
    <text x="300" y="44" fill="#9fb4c4" font-size="13" text-anchor="middle" font-weight="600">THE AI CAN</text>
    <text x="900" y="44" fill="#f3dfa6" font-size="13" text-anchor="middle" font-weight="600">ONLY PEOPLE AND SIGNED MANDATES CAN</text>

    <path class="line" pathLength="1" d="M100 128 H1100" stroke="#1f4d6e" stroke-width="6" stroke-linecap="round" fill="none"/>
    <circle r="7" fill="#5cc2c6"><animateMotion dur="7s" repeatCount="indefinite" begin="2s" path="M100 128 H1100"/></circle>

    <g class="gate">
      <line x1="600" y1="70" x2="600" y2="250" stroke="#d4a72c" stroke-width="2" stroke-dasharray="6 6"/>
      <rect x="532" y="74" width="136" height="26" rx="13" fill="#d4a72c"/>
      <text x="600" y="92" fill="#0b2a45" font-size="12" font-weight="800" text-anchor="middle">AI STOPS HERE</text>
    </g>

    <g text-anchor="middle">
      <g class="node n1"><circle cx="100" cy="128" r="36" fill="#1f8a96"/><text x="100" y="138" fill="#fff" font-size="26" font-weight="800">1</text>
        <text x="100" y="196" fill="#fff" font-size="18" font-weight="700">See</text><text x="100" y="220" fill="#9fb4c4" font-size="13">14-day cash forecast</text><text x="100" y="238" fill="#9fb4c4" font-size="13">3 scenarios</text></g>
      <g class="node n2"><circle cx="300" cy="128" r="36" fill="#1f8a96"/><text x="300" y="138" fill="#fff" font-size="26" font-weight="800">2</text>
        <text x="300" y="196" fill="#fff" font-size="18" font-weight="700">Predict</text><text x="300" y="220" fill="#9fb4c4" font-size="13">who will pay late</text><text x="300" y="238" fill="#9fb4c4" font-size="13">1,000 simulated futures</text></g>
      <g class="node n3"><circle cx="500" cy="128" r="36" fill="#1f8a96"/><text x="500" y="138" fill="#fff" font-size="26" font-weight="800">3</text>
        <text x="500" y="196" fill="#fff" font-size="18" font-weight="700">Propose</text><text x="500" y="220" fill="#9fb4c4" font-size="13">cheapest safe rescue</text><text x="500" y="238" fill="#9fb4c4" font-size="13">negotiates with partners</text></g>
      <g class="node n4"><circle cx="700" cy="128" r="36" fill="#d4a72c"/><text x="700" y="138" fill="#0b2a45" font-size="26" font-weight="800">4</text>
        <text x="700" y="196" fill="#fff" font-size="18" font-weight="700">Approve</text><text x="700" y="220" fill="#9fb4c4" font-size="13">PIN step-up</text><text x="700" y="238" fill="#9fb4c4" font-size="13">2 people for big amounts</text></g>
      <g class="node n5"><circle cx="900" cy="128" r="36" fill="#d4a72c"/><text x="900" y="138" fill="#0b2a45" font-size="26" font-weight="800">5</text>
        <text x="900" y="196" fill="#fff" font-size="18" font-weight="700">Execute</text><text x="900" y="220" fill="#9fb4c4" font-size="13">once, under a signed</text><text x="900" y="238" fill="#9fb4c4" font-size="13">expiring mandate</text></g>
      <g class="node n6"><circle cx="1100" cy="128" r="36" fill="#d4a72c"/><text x="1100" y="138" fill="#0b2a45" font-size="26" font-weight="800">6</text>
        <text x="1100" y="196" fill="#fff" font-size="18" font-weight="700">Prove</text><text x="1100" y="220" fill="#9fb4c4" font-size="13">hash-chained audit</text><text x="1100" y="238" fill="#9fb4c4" font-size="13">read-back verified</text></g>
    </g>
    <circle class="ring r1" cx="100" cy="128" r="36" fill="none" stroke="#5cc2c6" stroke-width="3"/>
    <circle class="ring r2" cx="300" cy="128" r="36" fill="none" stroke="#5cc2c6" stroke-width="3"/>
    <circle class="ring r3" cx="500" cy="128" r="36" fill="none" stroke="#5cc2c6" stroke-width="3"/>
    <circle class="ring r4" cx="700" cy="128" r="36" fill="none" stroke="#f3dfa6" stroke-width="3"/>
    <circle class="ring r5" cx="900" cy="128" r="36" fill="none" stroke="#f3dfa6" stroke-width="3"/>
    <circle class="ring r6" cx="1100" cy="128" r="36" fill="none" stroke="#f3dfa6" stroke-width="3"/>
  </g>
</svg>
