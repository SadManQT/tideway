<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 330" width="1200" height="330" role="img" aria-label="Who Tideway helps: SME owners, finance teams, banks and lenders, large buyers, auditors">
  <defs>
    <style>
      .t { font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; }
      .card { opacity: 0; animation: up .8s cubic-bezier(.22,1,.36,1) forwards; }
      .c1 { animation-delay: .15s } .c2 { animation-delay: .4s } .c3 { animation-delay: .65s } .c4 { animation-delay: .9s } .c5 { animation-delay: 1.15s }
      @keyframes up { from { opacity: 0; transform: translateY(24px) } to { opacity: 1; transform: none } }
      .bar { transform-box: fill-box; transform-origin: left; transform: scaleX(0); animation: grow 1s ease-out forwards; }
      .c1 .bar { animation-delay: .6s } .c2 .bar { animation-delay: .85s } .c3 .bar { animation-delay: 1.1s } .c4 .bar { animation-delay: 1.35s } .c5 .bar { animation-delay: 1.6s }
      @keyframes grow { to { transform: scaleX(1) } }
      .ico { fill: none; stroke: #5cc2c6; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
      .bob { transform-box: fill-box; transform-origin: center; animation: bob 3.2s ease-in-out infinite; }
      @keyframes bob { 50% { transform: translateY(-4px) } }
    </style>
  </defs>
  <rect width="1200" height="330" rx="18" fill="#0b2a45"/>
  <g class="t">
    <text x="40" y="44" fill="#5cc2c6" font-size="13" font-weight="700" letter-spacing="3">WHO IT HELPS</text>
    <rect x="40" y="56" width="60" height="3" fill="#d4a72c"/>

    <g transform="translate(40 80)"><g class="card c1">
      <rect width="208" height="222" rx="14" fill="#0f3a5c" stroke="#1f4d6e"/><rect class="bar" width="208" height="5" rx="2" fill="#5cc2c6"/>
      <g transform="translate(22 26)"><g class="bob"><circle cx="22" cy="22" r="22" fill="#12506d"/><path class="ico" d="M10 20h24l-2-7H12zM12 20v12h20V20M18 32v-6h8v6"/></g></g>
      <text x="22" y="104" fill="#fff" font-size="18" font-weight="700">SME owners</text>
      <text fill="#cfe2ea" font-size="13.5"><tspan x="22" y="132">Know days ahead if</tspan><tspan x="22" dy="20">payroll is at risk,</tspan><tspan x="22" dy="20">and exactly what to do</tspan><tspan x="22" dy="20">about it.</tspan></text>
    </g></g>
    <g transform="translate(268 80)"><g class="card c2">
      <rect width="208" height="222" rx="14" fill="#0f3a5c" stroke="#1f4d6e"/><rect class="bar" width="208" height="5" rx="2" fill="#5cc2c6"/>
      <g transform="translate(22 26)"><g class="bob"><circle cx="22" cy="22" r="22" fill="#12506d"/><path class="ico" d="M13 11h18v22H13zM17 16h10M17 21h4M24 21h4M17 26h4M24 26h4"/></g></g>
      <text x="22" y="104" fill="#fff" font-size="18" font-weight="700">Finance teams</text>
      <text fill="#cfe2ea" font-size="13.5"><tspan x="22" y="132">Zero-entry records,</tspan><tspan x="22" dy="20">a 13-week cash plan</tspan><tspan x="22" dy="20">and duplicate-payment</tspan><tspan x="22" dy="20">checks.</tspan></text>
    </g></g>
    <g transform="translate(496 80)"><g class="card c3">
      <rect width="208" height="222" rx="14" fill="#0f3a5c" stroke="#1f4d6e"/><rect class="bar" width="208" height="5" rx="2" fill="#d4a72c"/>
      <g transform="translate(22 26)"><g class="bob"><circle cx="22" cy="22" r="22" fill="#12506d"/><path class="ico" d="M10 17l12-7 12 7M12 18v12M18 18v12M26 18v12M32 18v12M10 33h24"/></g></g>
      <text x="22" y="104" fill="#fff" font-size="18" font-weight="700">Banks &amp; lenders</text>
      <text fill="#cfe2ea" font-size="13.5"><tspan x="22" y="132">Early warning across a</tspan><tspan x="22" dy="20">whole SME portfolio and</tspan><tspan x="22" dy="20">credit passports they can</tspan><tspan x="22" dy="20">verify themselves.</tspan></text>
    </g></g>
    <g transform="translate(724 80)"><g class="card c4">
      <rect width="208" height="222" rx="14" fill="#0f3a5c" stroke="#1f4d6e"/><rect class="bar" width="208" height="5" rx="2" fill="#d4a72c"/>
      <g transform="translate(22 26)"><g class="bob"><circle cx="22" cy="22" r="22" fill="#12506d"/><path class="ico" d="M9 15h16v13H9zM25 19h6l4 5v4H25M14 31a2.5 2.5 0 1 0 0 .1M30 31a2.5 2.5 0 1 0 0 .1"/></g></g>
      <text x="22" y="104" fill="#fff" font-size="18" font-weight="700">Large buyers</text>
      <text fill="#cfe2ea" font-size="13.5"><tspan x="22" y="132">Spot small suppliers</tspan><tspan x="22" dy="20">heading for a cash</tspan><tspan x="22" dy="20">crunch before the</tspan><tspan x="22" dy="20">supply chain breaks.</tspan></text>
    </g></g>
    <g transform="translate(952 80)"><g class="card c5">
      <rect width="208" height="222" rx="14" fill="#0f3a5c" stroke="#1f4d6e"/><rect class="bar" width="208" height="5" rx="2" fill="#d4a72c"/>
      <g transform="translate(22 26)"><g class="bob"><circle cx="22" cy="22" r="22" fill="#12506d"/><path class="ico" d="M22 9l11 4v8c0 7-11 12-11 12s-11-5-11-12v-8zM17 22l4 4 7-7"/></g></g>
      <text x="22" y="104" fill="#fff" font-size="18" font-weight="700">Auditors</text>
      <text fill="#cfe2ea" font-size="13.5"><tspan x="22" y="132">Every decision signed,</tspan><tspan x="22" dy="20">hash-chained and</tspan><tspan x="22" dy="20">replayable, with</tspan><tspan x="22" dy="20">who approved what.</tspan></text>
    </g></g>
  </g>
</svg>
