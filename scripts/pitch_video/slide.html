<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Tideway slide</title>
<style>
@font-face { font-family: "Space Grotesk"; src: url("{{FONTS}}/space-grotesk.woff2") format("woff2"); font-weight: 400 700; }
@font-face { font-family: "Unbounded"; src: url("{{FONTS}}/unbounded.woff2") format("woff2"); font-weight: 600 900; }
@font-face { font-family: "JetBrains Mono"; src: url("{{FONTS}}/jetbrains-mono.woff2") format("woff2"); font-weight: 400 700; }
:root { --lime:#cfe94b; --lime-soft:#f5fadc; --ink:#0e1348; --ink-2:#33396f; --muted:#555c8f; --violet:#5b2fd6; --pink:#d6337f;
  --grad: linear-gradient(100deg,#6a2fe0,#3b5bdb 58%,#22b8cf); --dots: radial-gradient(rgba(14,19,72,.13) 1.1px, transparent 1.4px) 0 0 / 22px 22px; }
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 1280px; height: 720px; overflow: hidden; }
body { background: var(--lime) var(--dots); color: var(--ink); font-family: "Space Grotesk", system-ui, sans-serif; }
.frame { position: absolute; inset: 0; padding: 56px 72px 48px; display: flex; flex-direction: column; }
.brand { display: flex; align-items: center; gap: 12px; font-family: "Unbounded"; font-weight: 800; font-size: 22px; }
.mark { width: 40px; height: 40px; border-radius: 11px; background: var(--ink); color: var(--lime); display: grid; place-items: center; box-shadow: 3px 3px 0 var(--violet); }
.mark svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; }
.sandbox { margin-left: auto; font-family: "JetBrains Mono"; font-size: 13px; font-weight: 700; letter-spacing: .5px; padding: 7px 14px; border: 2px solid var(--ink); border-radius: 999px; background: #fff7d6; }
.kicker { margin-top: 34px; font-family: "JetBrains Mono"; font-size: 17px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; color: var(--violet); }
h1 { margin-top: 12px; font-family: "Unbounded"; font-weight: 800; font-size: 50px; line-height: 1.08; letter-spacing: -.02em; }
.sub { margin-top: 16px; max-width: 1000px; font-size: 24px; line-height: 1.38; color: var(--ink-2); }
.items { margin-top: 30px; list-style: none; display: grid; grid-template-columns: repeat(var(--cols, 3), 1fr); gap: 20px; }
.item { background: #fff; border: 2.5px solid var(--ink); border-radius: 18px; box-shadow: 5px 5px 0 var(--ink); padding: 20px 22px; }
.item h3 { font-size: 23px; line-height: 1.2; font-weight: 700; }
.item p { margin-top: 8px; font-size: 18px; line-height: 1.38; color: var(--ink-2); }
.tag { display: inline-block; margin-bottom: 10px; font-family: "JetBrains Mono"; font-size: 13px; font-weight: 700; letter-spacing: .6px; text-transform: uppercase; padding: 3px 10px; border-radius: 999px; color: #fff; background: var(--violet); }
.stats { margin-top: 30px; list-style: none; display: grid; grid-template-columns: repeat(var(--cols, 2), 1fr); gap: 22px; }
.stat { background: var(--ink); color: #fff; border-radius: 18px; box-shadow: 5px 5px 0 var(--violet); padding: 22px 26px; display: flex; flex-direction: column; gap: 6px; }
.stat .label { font-family: "JetBrains Mono"; font-size: 15px; letter-spacing: 1px; text-transform: uppercase; color: var(--lime); }
.stat strong { font-family: "Unbounded"; font-size: 40px; font-weight: 800; line-height: 1.1; }
.stat .note { font-size: 17px; line-height: 1.35; color: #d7dbf5; }
.chips { margin-top: 26px; display: flex; flex-wrap: wrap; gap: 12px; }
.chip { font-weight: 700; font-size: 19px; padding: 9px 18px; border: 2.5px solid var(--ink); border-radius: 999px; background: #fff; box-shadow: 3px 3px 0 var(--ink); }
.people { margin-top: 30px; list-style: none; display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px 28px; }
.people li { font-size: 27px; font-weight: 700; padding: 14px 22px; background: #fff; border: 2.5px solid var(--ink); border-radius: 16px; box-shadow: 4px 4px 0 var(--ink); }
.foot { margin-top: auto; padding-top: 18px; font-size: 16px; color: var(--ink-2); font-family: "JetBrains Mono"; }
.layout-hero h1 { font-size: 68px; margin-top: 70px; }
.layout-hero h1 em { font-style: normal; background: var(--ink); color: var(--lime); padding: 0 14px; border-radius: 12px; }
.layout-hero .sub { font-size: 28px; }
.layout-hero .kicker { margin-top: 60px; }
.layout-team .stats { --cols: 1; }
.empty { display: none; }
/* entrance animation: paused until the recorder adds .play */
.kicker, h1, .sub, .item, .stat, .chip, .people li, .foot { opacity: 0; transform: translateY(18px); }
body.play .kicker, body.play h1, body.play .sub, body.play .item, body.play .stat, body.play .chip, body.play .people li, body.play .foot {
  animation: rise .7s cubic-bezier(.22,1,.36,1) forwards; }
body.play h1 { animation-delay: .15s; }
body.play .sub { animation-delay: .45s; }
body.play .item, body.play .stat, body.play .people li { animation-delay: calc(.9s + var(--i) * .55s); }
body.play .chip { animation-delay: calc(1.0s + var(--i) * .25s); }
body.play .foot { animation-delay: 1.6s; }
@keyframes rise { to { opacity: 1; transform: none; } }
.wave { position: absolute; right: -40px; bottom: -30px; width: 520px; opacity: .14; }
/* vector motion layer: drawn waves, drifting flow, pulsing nodes, growing bars */
.motion { position: absolute; inset: 0; z-index: 0; pointer-events: none; }
.frame { z-index: 1; }
.motion .flow { fill: none; stroke-width: 3; stroke-linecap: round; stroke-dasharray: 1600; stroke-dashoffset: 1600; }
.motion .flow.a { stroke: var(--violet); opacity: .30; } .motion .flow.b { stroke: var(--ink); opacity: .16; } .motion .flow.c { stroke: #22b8cf; opacity: .28; }
body.play .motion .flow { animation: draw 2.4s cubic-bezier(.22,1,.36,1) forwards, drift 9s ease-in-out 2.4s infinite alternate; }
body.play .motion .flow.b { animation-delay: .25s, 2.6s; } body.play .motion .flow.c { animation-delay: .5s, 2.9s; }
.motion .node { fill: var(--violet); opacity: 0; transform-box: fill-box; transform-origin: center; }
body.play .motion .node { animation: pop .6s cubic-bezier(.34,1.56,.64,1) forwards, pulse 2.4s ease-in-out infinite; animation-delay: calc(1.2s + var(--i) * .18s), calc(1.8s + var(--i) * .18s); }
.motion .bar { fill: var(--ink); opacity: .10; transform-box: fill-box; transform-origin: bottom; transform: scaleY(0); }
body.play .motion .bar { animation: grow 1.1s cubic-bezier(.22,1,.36,1) forwards; animation-delay: calc(.6s + var(--i) * .12s); }
.motion .sweep { fill: url(#sweep); opacity: 0; } body.play .motion .sweep { animation: sweep 3.2s ease-in-out .8s infinite; }
@keyframes draw { to { stroke-dashoffset: 0; } }
@keyframes drift { from { transform: translateX(0); } to { transform: translateX(-60px); } }
@keyframes pop { from { opacity: 0; transform: scale(.2); } to { opacity: .55; transform: scale(1); } }
@keyframes pulse { 50% { transform: scale(1.35); } }
@keyframes grow { to { transform: scaleY(1); } }
@keyframes sweep { 0% { opacity: 0; transform: translateX(-400px); } 30% { opacity: .5; } 100% { opacity: 0; transform: translateX(1400px); } }
@media (prefers-reduced-motion: reduce) { body.play .motion * { animation: none !important; opacity: .3; stroke-dashoffset: 0; transform: none; } }
</style></head>
<body class="layout-{{LAYOUT}}">
<svg class="motion" viewBox="0 0 1280 720" aria-hidden="true"><defs><linearGradient id="sweep" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".9"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient></defs>
  <path class="flow a" d="M-40 600 C 160 520, 320 680, 520 600 S 880 520, 1080 600 S 1360 660, 1400 600"/>
  <path class="flow b" d="M-40 640 C 180 580, 340 700, 560 640 S 900 570, 1110 640 S 1380 690, 1420 640"/>
  <path class="flow c" d="M-40 560 C 140 500, 300 630, 500 560 S 860 490, 1060 560 S 1340 610, 1400 560"/>
  <g><rect class="bar" x="1060" y="470" width="22" height="90" rx="4" style="--i:0"/><rect class="bar" x="1092" y="440" width="22" height="120" rx="4" style="--i:1"/><rect class="bar" x="1124" y="410" width="22" height="150" rx="4" style="--i:2"/><rect class="bar" x="1156" y="370" width="22" height="190" rx="4" style="--i:3"/><rect class="bar" x="1188" y="330" width="22" height="230" rx="4" style="--i:4"/></g>
  <circle class="node" cx="520" cy="600" r="7" style="--i:0"/><circle class="node" cx="800" cy="560" r="6" style="--i:1"/><circle class="node" cx="1080" cy="600" r="7" style="--i:2"/><circle class="node" cx="300" cy="610" r="5" style="--i:3"/>
  <rect class="sweep" x="0" y="0" width="260" height="720"/>
</svg>
<div class="frame">
  <div class="brand"><span class="mark"><svg viewBox="0 0 24 24"><path d="M3 9c3-3 6 3 9 0s6 3 9 0"/><path d="M3 15c3-3 6 3 9 0s6 3 9 0"/></svg></span>Tideway<span class="sandbox">SYNTHETIC SANDBOX · NO REAL MONEY</span></div>
  <div class="kicker">{{KICKER}}</div>
  <h1>{{TITLE}}</h1>
  <p class="sub">{{SUB}}</p>
  <ul class="items">{{ITEMS}}</ul>
  <ul class="stats">{{STATS}}</ul>
  <div class="chips">{{CHIPS}}</div>
  <ul class="people">{{PEOPLE}}</ul>
  <div class="foot">{{FOOT}}</div>
</div>
<script>
for (const el of document.querySelectorAll('.items,.stats,.chips,.people,.sub,.foot,.kicker')) if (!el.textContent.trim()) el.classList.add('empty');
const n = document.querySelectorAll('.item').length; if (n) document.querySelector('.items').style.setProperty('--cols', n === 4 ? 2 : Math.min(n, 3));
const s = document.querySelectorAll('.stat').length; if (s) document.querySelector('.stats').style.setProperty('--cols', s >= 3 ? 3 : s);
</script>
</body></html>
